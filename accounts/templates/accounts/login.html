<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | TindaTech POS</title>
    {% load static %}
    <link rel="icon" type="image/png"
      href="{% static 'images/weblogo.png' %}">
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#4349E8', dark: '#3338D0', soft: '#EEEFFD' },
                        canvas: '#EEF0FA',
                        ink: '#16161D'
                    }
                }
            }
        }
    </script>
    <style>
            @font-face {
        font-family: 'Poppins';
        src: url("{% static 'fonts/Poppins-Regular.ttf' %}") format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Poppins';
        src: url("{% static 'fonts/Poppins-Medium.ttf' %}") format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Poppins';
        src: url("{% static 'fonts/Poppins-SemiBold.ttf' %}") format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Poppins';
        src: url("{% static 'fonts/Poppins-Bold.ttf' %}") format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
    }

    body {
        font-family: 'Poppins', sans-serif;
    }
    </style>
</head>

<body class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden bg-canvas p-4 font-sans text-slate-800 antialiased">

    <!-- Soft background glows -->
    <div class="pointer-events-none absolute -left-24 -top-24 h-80 w-80 rounded-full bg-brand/20 blur-3xl" aria-hidden="true"></div>
    <div class="pointer-events-none absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-indigo-400/20 blur-3xl" aria-hidden="true"></div>

    <div class="relative w-full max-w-sm">

        <!-- Brand -->
        <div class="mb-8 flex flex-col items-center text-center">
            <img src="{% static 'images/weblogo.png' %}" alt="TindaTech POS logo"
                 class="mb-4 h-14 w-14 rounded-2xl object-cover shadow-lg shadow-brand/20">
            <h1 class="text-3xl font-semibold tracking-tight text-ink">TindaTech POS</h1>
            <p class="mt-1 text-sm text-slate-500">Sign in to your account</p>
        </div>

        <!-- Card -->
        <div class="rounded-3xl bg-white p-6 shadow-xl shadow-slate-300/40 sm:p-8">

            {% if form.errors %}
                <div role="alert" class="mb-5 flex gap-2.5 rounded-2xl border border-red-200 bg-red-50 p-3.5 text-sm text-red-700">
                    <svg class="mt-0.5 h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
                    <p>Incorrect username or password. Check your details and try again.</p>
                </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <input type="hidden" name="next" value="{{ next }}">

                <div>
                    <label for="id_username" class="mb-1.5 block text-sm font-medium text-slate-700">Username</label>
                    <input type="text" name="username" id="id_username"
                           autocomplete="username" required autofocus
                           class="w-full rounded-xl border border-slate-200 bg-canvas/50 px-4 py-3 text-sm placeholder:text-slate-400 focus:border-brand focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand/30">
                </div>

                <div>
                    <label for="id_password" class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="id_password"
                               autocomplete="current-password" required
                               class="w-full rounded-xl border border-slate-200 bg-canvas/50 py-3 pl-4 pr-16 text-sm placeholder:text-slate-400 focus:border-brand focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand/30">
                        <button type="button" id="toggle-password" aria-controls="id_password" aria-pressed="false"
                                class="absolute inset-y-0 right-0 rounded-r-xl px-4 text-xs font-medium text-brand hover:text-brand-dark focus:outline-none focus:ring-2 focus:ring-brand/30">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="w-full rounded-full bg-brand px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-brand/30 transition hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2">
                    Sign in
                </button>
            </form>
        </div>

        <p class="mt-6 text-center text-xs text-slate-400">TindaTech POS System | All rights reserved.</p>
    </div>

    <script>
        (function () {
            var input = document.getElementById('id_password');
            var btn = document.getElementById('toggle-password');
            btn.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.textContent = show ? 'Hide' : 'Show';
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
            });
        })();
    </script>
</body>
</html>
